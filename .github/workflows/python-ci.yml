name: Helpdesk Python Checks

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python
        run: python --version

      - name: Check Syntax
        run: python -m compileall -q .

      - name: Run Tests
        run: python -m unittest discover -v